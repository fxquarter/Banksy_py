<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banksy图构建改进</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f5f5f5;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 20%;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            position: fixed; /* 固定侧边栏 */
            overflow-y: auto; /* 允许侧边栏内容滚动 */
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #34495e;
            margin-bottom: 20px;
        }

        .sidebar-header h2 {
            margin: 0;
            color: #ecf0f1;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            padding: 12px 20px;
            transition: background-color 0.3s;
        }

        .sidebar-menu li:hover {
            background-color: #34495e;
            cursor: pointer;
        }

        .sidebar-menu li a {
            color: #ecf0f1;
            text-decoration: none;
            display: block;
        }

        /* 当前活动菜单项样式 */
        .sidebar-menu li.active {
            background-color: #34495e;
        }

        .sidebar-menu li.active a {
            color: #1abc9c; /* 高亮颜色 */
            font-weight: bold;
        }

        /* 主内容区样式 */
        .main-content {
            width: 80%;
            padding: 20px;
            margin-left: 20%; /* 为固定侧边栏留出空间 */
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .image-container {
            width: 48%;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .image-container:hover {
            transform: scale(1.02);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .image-container:hover .info-box {
            opacity: 1;
        }

        .info-box h3 {
            margin-top: 0;
            color: #fff;
        }

        .info-box p {
            margin-bottom: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-header">
        <h2>Banksy图构建改进</h2>
    </div>
    <ul class="sidebar-menu">
        <li><a href="cluster.html">综合聚类</a></li>
        <li><a href="umap.html">簇单独可视化</a></li>
        <li class="active"><a href="hot.html">矩阵热图</a></li>
        <li><a href="spatial.html">有无空间方法对比</a></li>
    </ul>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <h1>Banksy图构建改进</h1>

    <div class="gallery">
        <!-- 第一行 -->
        <div class="image-container">
            <img src="image/复现矩阵热图.png" alt="复现矩阵热图">
            <div class="info-box">
                <h3>复现矩阵热图</h3>
                <p>关联矩阵较 “原始”，类别间关联分散，含较多非核心关联，结构复杂度高但噪声也多</p>
            </div>
        </div>

        <!-- 第二行 -->
        <div class="image-container">
            <img src="image/k自适应矩阵热图.png" alt="k自适应矩阵热图">
            <div class="info-box">
                <h3>k自适应矩阵热图</h3>
                <p>强化自关联、抑制跨类别冗余，对角线更突出，结构开始简洁化。</p>
            </div>
        </div>

        <!-- 第三行 -->
        <div class="image-container">
            <img src="image/细胞过滤优化后矩阵热图.png" alt="细胞过滤优化后矩阵热图">
            <div class="info-box">
                <h3>细胞过滤优化后矩阵热图</h3>
                <p>进一步净化数据，弱化噪声关联，关联更聚焦核心，颜色分布更 “干净”。因为版本不兼容未显示数字但仍然可以通过颜色分辨区间</p>
            </div>
        </div>

        <!-- 第四行 -->
        <div class="image-container">
            <img src="image/图构建后矩阵热图.png" alt="图构建后矩阵热图">
            <div class="info-box">
                <h3>图构建后矩阵热图</h3>
                <p>最大化凸显类别自关联，极大压缩跨类别非必要关联，关联结构最简洁、清晰，类别区分度最高。</p>
            </div>
        </div>

    </div>
</div>
</body>
</html>
